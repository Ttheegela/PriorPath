name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: priorpath
          POSTGRES_PASSWORD: priorpath
          POSTGRES_DB: priorpath_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U priorpath"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://priorpath:priorpath@localhost:5433/priorpath_test
      DATABASE_URL: postgresql+psycopg://priorpath:priorpath@localhost:5433/priorpath_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app evals scripts
      - run: pytest -q
      - run: alembic check
      - run: python -m evals.run --n 300 --seed 7
      - run: git diff --exit-code evals/results
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
