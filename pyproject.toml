# Vercel's Python builder reads [project]; keep dependencies in sync with requirements.txt.
[project]
name = "priorpath"
version = "2.0.0.dev0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "langgraph>=1.2,<2",
    "openai>=1.40,<4",
    "itsdangerous>=2.2,<3",
    "python-docx>=1.1,<2",
    "pypdfium2>=4.30,<6",
    "pillow>=10,<13",
    "langfuse>=3.10,<5",
    "presidio-analyzer>=2.2,<3",
    "spacy>=3.8,<4",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "docx", "docx.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# UI is served from Vercel's CDN (built into public/), not bundled into the function.
[tool.vercel.fastapi.static]
exclude = true
# The trace-flush ASGI middleware would otherwise keep the frontend inside the function,
# where `exclude` removes it; promote static files to the CDN regardless.
cdn = true
